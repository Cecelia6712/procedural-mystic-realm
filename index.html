<script>
function __showErr(msg) {
  const el = document.getElementById('errbox');
  if (!el) return;
  el.style.display = 'block';
  el.textContent = '⚠ ' + msg;
  clearTimeout(window.__errTimer);
  window.__errTimer = setTimeout(() => { el.style.display = 'none'; }, 2500);
}

<script type="module">
import * as THREE from 'three';
import { Brush, Evaluator, SUBTRACTION } from 'three-bvh-csg';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import GUI from 'lil-gui';

/* ==========================================================
   参数（默认值已下调亮度）
   ========================================================== */
const params = {
  bloom: { enabled: true, strength: 0.55, radius: 0.50, threshold: 0.45 },
  terrain: { H: 0.85, height: 44, center: 20, snowLine: 40 },
  particles: { count: 680, sizeMul: 1.0, alphaMul: 1.0, clusterP: 0.65 },
  forest: { count: 110 },
  light: { sun: 2.0, fog: 0.0016, exposure: 0.85 },
  camera: { fov: 62, speed: 26 }
};

/* ==========================================================
   渲染器 + 场景 + 灯光 + Bloom
   ========================================================== */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = params.light.exposure;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1e2842);
scene.fog = new THREE.FogExp2(0x1e2842, params.light.fog);
scene.add(new THREE.HemisphereLight(0xa8c0e0, 0x3a2a18, 1.4));

const sun = new THREE.DirectionalLight(0xfff0d8, params.light.sun);
sun.position.set(110, 130, 50);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -180; sun.shadow.camera.right = 180;
sun.shadow.camera.top = 180; sun.shadow.camera.bottom = -180;
sun.shadow.camera.near = 20; sun.shadow.camera.far = 450;
sun.shadow.camera.updateProjectionMatrix();
sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.08;
scene.add(sun); scene.add(sun.target);

const rimLight = new THREE.DirectionalLight(0x6688aa, 0.6);
rimLight.position.set(-60, 40, -70); scene.add(rimLight);

const composer = new EffectComposer(renderer);
composer.setPixelRatio(Math.min(devicePixelRatio, 2));
composer.setSize(innerWidth, innerHeight);

const renderPass = new RenderPass(scene, new THREE.PerspectiveCamera());
const bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), params.bloom.strength, params.bloom.radius, params.bloom.threshold);
const outputPass = new OutputPass();

composer.addPass(renderPass); composer.addPass(bloomPass); composer.addPass(outputPass);

/* ==========================================================
   PRNG + Perlin + fBm + 地形
   ========================================================== */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;

}
class Perlin2D {
  constructor(seed = 1337) {
    this.p = new Uint8Array(512);
    const perm = Array.from({ length: 256 }, (_, i) => i);
    const rng = mulberry32(seed);
    for (let i = 255; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [perm[i], perm[j]] = [perm[j], perm[i]]; }
    for (let i = 0; i < 512; i++) this.p[i] = perm[i & 255];
  }
  _fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
  _lerp(a, b, t) { return a + t * (b - a); }
  _grad(h, x, y) { const hh = h & 7; const u = hh < 4 ? x : y; const v = hh < 4 ? y : x; return ((hh & 1) ? -u : u) + ((hh & 2) ? -2 * v : 2 * v); }
  noise(x, y) {
    const X = Math.floor(x) & 255, Y = Math.floor(y) & 255;
    const xf = x - Math.floor(x), yf = y - Math.floor(y);
    const u = this._fade(xf), v = this._fade(yf);
    const aa = this.p[this.p[X] + Y], ab = this.p[this.p[X] + Y + 1], ba = this.p[this.p[X + 1] + Y], bb = this.p[this.p[X + 1] + Y + 1];
    const x1 = this._lerp(this._grad(aa, xf, yf), this._grad(ba, xf - 1, yf), u), x2 = this._lerp(this._grad(ab, xf, yf - 1), this._grad(bb, xf - 1, yf - 1), u);
    return this._lerp(x1, x2, v);

const perlin = new Perlin2D(1337);
function fbm(x, y, octaves, H) {
  let sum = 0, amp = 1, freq = 1, norm = 0, gain = Math.pow(2, -H);
  for (let i = 0; i < octaves; i++) { sum += amp * perlin.noise(x * freq, y * freq); norm += amp; amp *= gain; freq *= 2.0; }
  return sum / norm;
}

const TERRAIN_SIZE = 460, TERRAIN_SEG = 180, WATER_LEVEL = -1;
function sampleTerrainHeight(x, z) {
  const nx = x / (TERRAIN_SIZE * 0.5), nz = z / (TERRAIN_SIZE * 0.5);
  const r = Math.sqrt(nx * nx + nz * nz);
  let f = fbm(x * 0.006 + 23.7, z * 0.006 + 91.3, 6, params.terrain.H);
  f = f * 0.5 + 0.5;
  const mask = Math.max(0, 1 - r * r), island = Math.pow(mask, 1.6);
  const centerNoise = fbm(x * 0.02 + 300, z * 0.02 + 500, 4, 0.65) * 0.5 + 0.5;
  const centerBump = params.terrain.center * island * (0.7 + 0.35 * centerNoise);
  const shoulder = 10 * Math.max(0, 1 - Math.max(0, r - 0.12) / (0.55 - 0.12));
  const h = f * params.terrain.height * mask + centerBump + shoulder;
  return h - Math.max(0, r - 0.82) * 55 + WATER_LEVEL;
}

let terrainMesh = null;
function buildTerrainMesh() {
  const geo = new THREE.PlaneGeometry(TERRAIN_SIZE, TERRAIN_SIZE, TERRAIN_SEG, TERRAIN_SEG);
  geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position, colors = new Float32Array(pos.count * 3);
  const cDeep = new THREE.Color(0x0a1a2a), cShallow = new THREE.Color(0x1a4a6a), cSand = new THREE.Color(0xb8a888);
  const cGrass = new THREE.Color(0x6a8a4a), cForest = new THREE.Color(0x2e4a20), cShrub = new THREE.Color(0x7a8a3a);
  const cRockDark = new THREE.Color(0x4a4540), cRock = new THREE.Color(0x7a706a), cSnow = new THREE.Color(0xf0eaf5);
  const tmp = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i), y = sampleTerrainHeight(x, z); pos.setY(i, y);
    const snowLine = params.terrain.snowLine + perlin.noise(x * 0.06, z * 0.06) * 2.5;
    if (y < -1.5) tmp.copy(cDeep).lerp(cShallow, THREE.MathUtils.clamp((y + 4) / 2.5, 0, 1));
    else if (y < 2) tmp.copy(cShallow).lerp(cSand, (y + 1.5) / 3.5);
    else if (y < 6) tmp.copy(cSand).lerp(cGrass, (y - 2) / 4);
    else if (y < 14) tmp.copy(cGrass).lerp(cForest, (y - 6) / 8);
    else if (y < 22) tmp.copy(cForest).lerp(cShrub, (y - 14) / 8);
    else if (y < 30) tmp.copy(cShrub).lerp(cRockDark, (y - 22) / 8);
    else if (y < snowLine - 3) tmp.copy(cRockDark).lerp(cRock, (y - 30) / Math.max(1, snowLine - 33));
    else if (y < snowLine) tmp.copy(cRock).lerp(cSnow, (y - (snowLine - 3)) / 3);
    else tmp.copy(cSnow);
    colors[i * 3 + 0] = tmp.r; colors[i * 3 + 1] = tmp.g; colors[i * 3 + 2] = tmp.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geo.computeVertexNormals();
  const mat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.92, metalness: 0.02 });
  const mesh = new THREE.Mesh(geo, mat); mesh.receiveShadow = true;
  return mesh;
}
function rebuildTerrain() {
  if (terrainMesh) { scene.remove(terrainMesh); terrainMesh.geometry.dispose(); terrainMesh.material.dispose(); }
  terrainMesh = buildTerrainMesh(); scene.add(terrainMesh);
  rebuildForest(); rebuildParticles();
}

const waterGeo = new THREE.PlaneGeometry(TERRAIN_SIZE * 2.5, TERRAIN_SIZE * 2.5);
waterGeo.rotateX(-Math.PI / 2);
const water = new THREE.Mesh(waterGeo, new THREE.MeshStandardMaterial({ color: 0x1a3045, roughness: 0.15, metalness: 0.65, transparent: true, opacity: 0.85 }));
water.position.y = WATER_LEVEL; water.receiveShadow = true; scene.add(water);

/* ==========================================================
   树 (L-System)
   ========================================================== */
const TREE_AXIOM = 'X', TREE_RULES = { 'X': 'F[+X][-X]F[&X]', 'F': 'FF' }, TREE_ITER = 3;
const Y_UP = new THREE.Vector3(0, 1, 0);
const cylGeo = new THREE.CylinderGeometry(0.78, 1.0, 1.0, 7, 1, false);
const leafGeo = new THREE.IcosahedronGeometry(1.0, 0);
const treeMat = new THREE.MeshStandardMaterial({ color: 0x4a3020, roughness: 0.92, metalness: 0.02, flatShading: true });
const leafMat = new THREE.MeshStandardMaterial({ color: 0x2e5a20, roughness: 0.85, metalness: 0.0, flatShading: true });
const forestGroup = new THREE.Group(); scene.add(forestGroup);
const dynamicGroup = new THREE.Group(); scene.add(dynamicGroup);

function expandLSystem(axiom, rules, iterations) {

  for (let it = 0; it < iterations; it++) {
    let next = ''; for (let k = 0; k < s.length; k++) next += rules[s[k]] || s[k]; s = next;
  }
  return s;
}
function buildTreeSegments(axiom, rules, iterations, options) {
  const str = expandLSystem(axiom, rules, iterations);
  const { angle, length0, trunkHeight, baseRadius, trunkRadius } = options;
  const a = angle * Math.PI / 180, segments = [], leaves = [];
  const pos = new THREE.Vector3(0, 0, 0), q = new THREE.Quaternion(); let length = length0;
  segments.push({ a: new THREE.Vector3(0, 0, 0), b: new THREE.Vector3(0, trunkHeight, 0), r0: trunkRadius, r1: trunkRadius * 0.82 });
  pos.y = trunkHeight;
  const stack = [], Y = new THREE.Vector3(0, 1, 0), X = new THREE.Vector3(1, 0, 0), Z = new THREE.Vector3(0, 0, 1);
  const forward = new THREE.Vector3(), dq = new THREE.Quaternion(), leafRng = mulberry32(Math.floor(a * 1000));
  for (const ch of str) {
    switch (ch) {
      case 'F':
        forward.copy(Y).applyQuaternion(q); const end = pos.clone().addScaledVector(forward, length);
        const depth = stack.length, r0 = baseRadius * Math.pow(0.68, depth), r1 = baseRadius * Math.pow(0.68, depth + 1);
        segments.push({ a: pos.clone(), b: end, r0, r1 });
        if (depth >= 2 && leafRng() < 0.55) leaves.push(end.clone());
        pos.copy(end); length *= 0.90; break;
      case '+': dq.setFromAxisAngle(Z, a); q.multiply(dq); break;
      case '-': dq.setFromAxisAngle(Z, -a); q.multiply(dq); break;
      case '&': dq.setFromAxisAngle(X, a); q.multiply(dq); break;
      case '^': dq.setFromAxisAngle(X, -a); q.multiply(dq); break;
      case '\\': dq.setFromAxisAngle(Y, a); q.multiply(dq); break;
      case '/': dq.setFromAxisAngle(Y, -a); q.multiply(dq); break;
      case '[': stack.push({ pos: pos.clone(), q: q.clone(), length }); break;
      case ']': { const s = stack.pop(); if (s) { pos.copy(s.pos); q.copy(s.q); length = s.length; } break; }
    }
  }
  return { segments, leaves };
}

function createSingleTreeMesh(x, y, z, rng) {
  const { segments, leaves } = buildTreeSegments(TREE_AXIOM, TREE_RULES, TREE_ITER, {
    angle: 20 + rng() * 14, length0: 0.85 + rng() * 0.45, trunkHeight: 1.9 + rng() * 1.6,
    baseRadius: 0.18 + rng() * 0.10, trunkRadius: 0.34 + rng() * 0.14
  });
  const rotY = rng() * Math.PI * 2;
  const group = new THREE.Group();

  const treeMesh = new THREE.InstancedMesh(cylGeo, treeMat, segments.length);
  treeMesh.castShadow = true; treeMesh.receiveShadow = true;
  const _m4 = new THREE.Matrix4(), _q = new THREE.Quaternion(), _dir = new THREE.Vector3(), _mid = new THREE.Vector3(), _scl = new THREE.Vector3();

  for (let i = 0; i < segments.length; i++) {
    const s = segments[i];
    const a = s.a.clone().applyAxisAngle(Y_UP, rotY);
    const b = s.b.clone().applyAxisAngle(Y_UP, rotY);
    _dir.subVectors(b, a); const len = _dir.length();
    if (len < 1e-4) { _m4.makeScale(0, 0, 0); treeMesh.setMatrixAt(i, _m4); continue; }
    _mid.addVectors(a, b).multiplyScalar(0.5); _q.setFromUnitVectors(Y_UP, _dir.normalize());
    const rMid = (s.r0 + s.r1) * 0.5; _scl.set(rMid, len, rMid); _m4.compose(_mid, _q, _scl);
    treeMesh.setMatrixAt(i, _m4);
  }
  treeMesh.instanceMatrix.needsUpdate = true; group.add(treeMesh);

  const leafMesh = new THREE.InstancedMesh(leafGeo, leafMat, leaves.length);
  leafMesh.castShadow = true; leafMesh.receiveShadow = true;
  const _qId = new THREE.Quaternion();
  for (let i = 0; i < leaves.length; i++) {
    const p = leaves[i].clone().applyAxisAngle(Y_UP, rotY);
    const sc = 0.45 + rng() * 0.30;
    _scl.set(sc, sc * 0.85, sc);
    _m4.compose(p, _qId, _scl); leafMesh.setMatrixAt(i, _m4);
  }
  leafMesh.instanceMatrix.needsUpdate = true; group.add(leafMesh);

  group.position.set(x, y, z);
  return group;
}

function rebuildForest() {
  while (forestGroup.children.length) {
    const m = forestGroup.children.pop();
    if (m.geometry && m.geometry !== cylGeo && m.geometry !== leafGeo) m.geometry.dispose();
    if (m.material && m.material !== treeMat && m.material !== leafMat) m.material.dispose();
  }
  const rng = mulberry32(2024), placed = []; let attempts = 0;
  while (placed.length < params.forest.count && attempts < 3000) {
    attempts++; const r = 28 + rng() * 140, ang = rng() * Math.PI * 2;
    const x = Math.cos(ang) * r, z = Math.sin(ang) * r, y = sampleTerrainHeight(x, z);
    if (y < 4 || y > 18) continue;
    let ok = true;
    for (const t of placed) { if ((t.x - x) ** 2 + (t.z - z) ** 2 < 12) { ok = false; break; } }
    if (ok) placed.push({ x, y, z });
  }
  for (let i = 0; i < placed.length; i++) {
    const tree = placed[i], tRng = mulberry32(1000 + i * 17);
    const singleTree = createSingleTreeMesh(tree.x, tree.y, tree.z, tRng);
    while (singleTree.children.length) forestGroup.add(singleTree.children[0]);
  }

/* ==========================================================
   观测站 (CSG + Sweep)
   ========================================================== */
function cubicBezier(p0, p1, p2, p3, t, out) {

function createSweepTube(ctrl, radius, N = 128, M = 24) {

}
function buildTowerWithCSG() {
  const tower = new Brush(new THREE.CylinderGeometry(5, 5.8, 22, 48, 1)); tower.position.set(0, 12.2, 0); tower.updateMatrixWorld();
  const door = new Brush(new THREE.BoxGeometry(3.2, 5.5, 12)); door.position.set(0, 3.8, 0); door.updateMatrixWorld();
  const windows = [10.5, 14.0, 17.5, 20.0].map(y => { const b = new Brush(new THREE.BoxGeometry(2.0, 2.2, 12)); b.position.set(0, y, 0); b.updateMatrixWorld(); return b; });
  const ev = new Evaluator(); let result = ev.evaluate(tower, door, SUBTRACTION);
  for (const w of windows) result = ev.evaluate(result, w, SUBTRACTION);
  result.material = new THREE.MeshStandardMaterial({ color: 0x5a4a40, roughness: 0.88, metalness: 0.25, side: THREE.DoubleSide });
  result.castShadow = true; result.receiveShadow = true; result.updateMatrixWorld(); return result;
}

/* ==========================================================
   ★ 交互：点击种树
   ========================================================== */
const raycaster = new THREE.Raycaster();
const screenCenter = new THREE.Vector2(0, 0);
const activeEffects = [];
const ringGeo = new THREE.RingGeometry(0.1, 0.2, 32);
ringGeo.rotateX(-Math.PI / 2);

document.addEventListener('mousedown', (e) => {
  if (document.pointerLockElement !== canvas || e.button !== 0) return;
  raycaster.setFromCamera(screenCenter, camera);
  const intersects = raycaster.intersectObject(terrainMesh);
  if (intersects.length > 0) {
    const hit = intersects[0].point;
    const y = hit.y;
    const snowLine = params.terrain.snowLine;
    if (y < WATER_LEVEL + 1) { __showErr('❌ 不能在水中种树'); return; }
    if (y > snowLine - 2) { __showErr('❌ 雪线以上太冷，树木无法存活'); return; }

    const rng = mulberry32(Date.now());
    const singleTree = createSingleTreeMesh(hit.x, y, hit.z, rng);
    singleTree.scale.set(0.01, 0.01, 0.01);
    dynamicGroup.add(singleTree);

    const ringMat = new THREE.MeshBasicMaterial({
      color: 0x88ffaa, transparent: true, opacity: 1.0, side: THREE.DoubleSide,
      blending: THREE.AdditiveBlending, depthWrite: false
    });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.position.copy(hit); ring.position.y += 0.1;
    scene.add(ring);

    activeEffects.push({ tree: singleTree, ring: ring, time: 0, duration: 0.8 });
  }
});

function updateEffects(dt) {
  for (let i = activeEffects.length - 1; i >= 0; i--) {
    const fx = activeEffects[i];
    fx.time += dt;
    const t = fx.time / fx.duration;
    if (t >= 1) {
      fx.tree.scale.set(1, 1, 1);
      scene.remove(fx.ring);
      fx.ring.material.dispose();
      activeEffects.splice(i, 1);
    } else {
      const scale = Math.sin(t * Math.PI * 0.5);
      fx.tree.scale.set(scale, scale, scale);
      const ringScale = 1 + t * 150;
      fx.ring.scale.set(ringScale, 1, ringScale);
      fx.ring.material.opacity = 1.0 - t * t;
    }
  }
}

fP2.add(presets, 'reset').name('恢复默认');

// 只折叠次要的，主要（Bloom、粒子）默认展开
fT.close(); fF.close(); fC.close(); fP2.close();

/* ==========================================================
   主循环
   ========================================================== */
function updateHUD() {
  const p = (mode === 'persp') ? cam.pos : ortho.eye, groundY = sampleTerrainHeight(p.x, p.z);
  hud.innerHTML = `模块 7 · 完整面板 + 交互种树\n模式 : <b>${mode === 'persp' ? '透视' : '正交'}</b>\n粒子 : <b>${params.particles.count}</b> 个\n操作 : WASD · 左键种树 · V 切投影 · 右上调参`;
}

rebuildTerrain(); rebuildParticles(); rebuildForest(); realignStationAndCam(); updateMatrices();

let lastTime = performance.now(), totalTime = 0;
function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now; totalTime += dt;

  updateMovement(dt);
  updateEffects(dt);
  if (particleSystem) particleSystem.update(dt, totalTime);
  updateMatrices(); updateHUD();

  composer.render();
}

addEventListener('resize', () => {
  const pr = Math.min(devicePixelRatio, 2);
  renderer.setPixelRatio(pr); renderer.setSize(innerWidth, innerHeight);
  composer.setPixelRatio(pr); composer.setSize(innerWidth, innerHeight);
  if (particleSystem) particleSystem.mat.uniforms.uPixelRatio.value = pr;
});

requestAnimationFrame(animate);
</script>
</body>
